# .github/workflows/keepalive.yml  —  v3 (endurecido)
# Mantiene "despierto" el proyecto de Supabase (plan Free pausa a los 7 días
# de inactividad de BASE DE DATOS). Hace una consulta REST real a la tabla
# app_state; con RLS, el anon recibe [] y 200 -> eso ya cuenta como actividad.
#
# Claves de este arreglo:
#  - SOLO cabecera `apikey` (la clave sb_publishable_ NO es un JWT; mandarla
#    como Authorization: Bearer da 401 — ese era el fallo de la v1).
#  - REINTENTOS: un 5xx puntual de Supabase NO tumba el job (así no te llega
#    un correo de "run failed" por un tropiezo pasajero).
#  - Si el proyecto está PAUSADO, el ping no lo reactiva: avisa para que pulses
#    Restore en el panel una vez.
#
# GitHub desactiva los cron tras 60 días SIN COMMITS en el repo. Como subes
# versiones de la app cada cierto tiempo, eso mantiene vivo el cron. Si alguna
# vez paras el desarrollo >~55 días, dímelo y le añado un paso anti-desactivación.

name: keepalive

on:
  schedule:
    - cron: '23 7 * * *'     # todos los días 07:23 UTC (holgura de sobra sobre los 7 días)
  workflow_dispatch:          # permite lanzarlo a mano con "Run workflow"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase (solo apikey; con reintentos)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL / SUPABASE_ANON_KEY (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          BASE="${SUPABASE_URL%/}"
          URL="${BASE}/rest/v1/app_state?select=user_id&limit=1"
          echo "Consultando: ${URL}"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/body.txt -w '%{http_code}' \
                   -H "apikey: ${SUPABASE_ANON_KEY}" \
                   -H "Accept: application/json" \
                   "${URL}") || code="000"
            echo "Intento ${i} -> HTTP ${code}"
            # 2xx = proyecto despierto y consulta hecha (éxito).
            if [ "${code}" -ge 200 ] 2>/dev/null && [ "${code}" -lt 300 ] 2>/dev/null; then
              echo "OK: Supabase responde ${code}. Actividad de BD registrada. Cabecera usada: solo apikey."
              head -c 300 /tmp/body.txt; echo
              exit 0
            fi
            # 4xx (p. ej. 401/403) = alcanzable pero permisos/RLS: la petición llegó,
            # cuenta como actividad; lo tratamos como éxito para no fallar en vano.
            if [ "${code}" -ge 400 ] 2>/dev/null && [ "${code}" -lt 500 ] 2>/dev/null; then
              echo "Aviso: HTTP ${code} (alcanzable, pero revisa apikey/RLS). Se considera actividad."
              head -c 300 /tmp/body.txt; echo
              exit 0
            fi
            echo "Sin respuesta útil (posible pausa, incidencia de Supabase o red). Reintento en 20 s..."
            sleep 20
          done
          echo "::error::5 intentos sin respuesta 2xx/4xx."
          echo "Si el proyecto aparece PAUSADO en el panel, un ping NO lo reactiva:"
          echo "entra a Supabase -> tu proyecto -> Restore (una sola vez)."
          echo "Última respuesta recibida:"; cat /tmp/body.txt || true
          exit 1
