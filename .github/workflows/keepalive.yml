# Keep-alive de Supabase — evita que el plan gratuito pause el proyecto por
# inactividad. Ping diario a la API REST (consulta mínima) que cuenta como
# actividad de base de datos. Usa SOLO la cabecera apikey con la clave anon /
# publishable (pública por diseño; la seguridad real es el RLS).
#
# INSTALACIÓN (una vez):
#  1. Sube ESTE archivo a tu repo en:  .github/workflows/keepalive.yml
#  2. Settings → Secrets and variables → Actions → New repository secret:
#       - SUPABASE_URL        (https://....supabase.co)
#       - SUPABASE_ANON_KEY   (la clave anon / publishable)
#  3. Pestaña Actions → «Supabase keep-alive» → Run workflow (debe salir verde).
#
# Nota: GitHub desactiva las tareas programadas tras ~60 días sin commits.

name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase (solo apikey, como hace la app)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Faltan los secretos SUPABASE_URL / SUPABASE_ANON_KEY."; exit 1
          fi
          base="${SUPABASE_URL%/}"
          echo "GET ${base}/rest/v1/app_state?select=app_id&limit=1"
          code=$(curl -sS -m 30 -o /tmp/resp.txt -w "%{http_code}" \
            "${base}/rest/v1/app_state?select=app_id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          rc=$?
          echo "curl exit: ${rc}"
          echo "===================================="
          echo "Respuesta HTTP: ${code}"
          echo "Cuerpo:"; head -c 800 /tmp/resp.txt || true; echo
          echo "===================================="
          if [ "${rc}" -ne 0 ]; then
            echo "No se pudo contactar con Supabase (¿URL mal? ¿proyecto caído?)."; exit 1
          fi
          if [ "${code}" -ge 200 ] && [ "${code}" -lt 300 ]; then
            echo "Keep-alive OK: Supabase respondió ${code}. Actividad registrada."
          else
            echo "Supabase respondió ${code} (no 2xx). Pistas:"
            echo " - 401: la clave anon no es válida para este proyecto."
            echo " - 404: la tabla 'app_state' no existe todavía (créala con el SQL de la guía)."
            exit 1
          fi
